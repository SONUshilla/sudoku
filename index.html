<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sudoku Home</title>

  <style>
    /* Reset + Base Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(120deg, #a8e6cf, #dcedc1);
      background-size: 200% 200%;
      animation: bgMove 10s ease-in-out infinite;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Main Card Container */
    .home-container {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 3rem 4rem;
      box-shadow: 0 10px 35px rgba(56, 142, 60, 0.25);
      text-align: center;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: fadeIn 1s ease forwards;
    }

    .home-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 45px rgba(56, 142, 60, 0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Title */
    h1 {
      font-size: 3.2rem;
      color: #2e7d32;
      margin-bottom: 1.2rem;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
      letter-spacing: 1px;
      animation: slideDown 1.2s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .subtitle {
      font-size: 1.15rem;
      color: #3d3d3d;
      opacity: 0.85;
      margin-bottom: 2.2rem;
      letter-spacing: 0.3px;
    }

    /* Buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      color: white;
      cursor: pointer;
      background-color: #66bb6a;
      box-shadow: 0 5px 15px rgba(102, 187, 106, 0.3);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px);
      background-color: #388e3c;
      box-shadow: 0 8px 25px rgba(56, 142, 60, 0.4);
    }

    button:nth-child(2) {
      background-color: #81c784;
      box-shadow: 0 5px 15px rgba(129, 199, 132, 0.3);
    }

    button:nth-child(2):hover {
      background-color: #43a047;
      box-shadow: 0 8px 25px rgba(67, 160, 71, 0.4);
    }

    /* Floating Effect */
    .home-container {
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 12px;
      color: rgba(0, 0, 0, 0.6);
      font-size: 0.9rem;
      letter-spacing: 0.4px;
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .home-container {
        width: 90%;
        padding: 2rem;
      }

      h1 {
        font-size: 2.5rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      button {
        font-size: 1rem;
        padding: 0.9rem 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="home-container">
    <h1>🧩 Sudoku</h1>
    <p class="subtitle">Sharpen your logic — one puzzle at a time.</p>

    <div class="button-group">
      <button onclick="startPlay()">🎯 Solve Sudoku</button>
      <button onclick="startGenerate()">🧠 Generate Sudoku</button>
    </div>
  </div>

  <footer>© 2025 Sudoku | Calm Mind. Sharp Logic.</footer>

  <script>
    function startPlay() {
      window.location.href = "./playSudoku.html";
    }

    function startGenerate() {
      window.location.href = "./sudolu.html";
    }
  </script>
</body>
</html>
